<body>
  <header class="proto-bar">
    <div class="proto-brand">
      <svg class="proto-mark" viewBox="0 0 512 512" aria-hidden="true"><use href="#i-duo-logo-full"/></svg>
      <span class="proto-brand-copy">
        <strong>LumaDuo</strong>
        <span>流明双屏 · UI prototype</span>
      </span>
    </div>
    <nav class="proto-nav" aria-label="Prototype pages">
      <button data-page="hosts" class="active">主机</button>
      <button data-page="apps">应用</button>
      <button data-page="remote">远程</button>
      <button data-page="settings">设置</button>
      <button data-page="stream">串流</button>
      <button data-action="open-pair">配对</button>
    </nav>
    <div class="proto-actions">
      <button id="viewToggle" class="proto-toggle">单屏预览</button>
      <span class="proto-hint">方向键移动 · Enter 确认 · Esc 返回 · R 直通/本地 · Q/E 切页签</span>
    </div>
  </header>

  <main class="stage">
    <div class="device" id="dualView">
      <div class="screen-meta"><span>上屏</span><span>832 × 468 · 只读</span></div>
      <section class="top-screen" id="topScreen" aria-label="Top screen preview"></section>
      <div class="screen-meta"><span>下屏</span><span>640 × 480 · 全部操作</span></div>
      <section class="bottom-screen" id="bottomScreen" aria-label="Bottom screen UI"></section>
    </div>
    <section class="single-wrap" id="singleView" hidden aria-label="Single screen preview"></section>
  </main>

  <div class="proto-foot">
    <span>Prototype only · 1dp = 1px · dark theme · Lumen Gold</span>
    <span>下屏 UI 是交互稿，不是生产代码</span>
  </div>
